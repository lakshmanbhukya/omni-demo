name: CI

on:
  push:
    branches:
      - 'fail/**'
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      - name: Lint check
        run: npx eslint .

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify environment config
        run: |
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "##[error] Required secret VITE_API_URL is not configured in GitHub Secrets."
            echo "##[error] Go to: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "Environment config verified."
