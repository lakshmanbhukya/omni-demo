name: CI

on:
  push:
    branches:
      - 'fail/**'
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      - name: Lint check
        run: npx eslint .

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify environment config
        run: |
          if [ -z "${{ secrets.PROD_DATABASE_URL }}" ]; then
            echo "##[error] Required secret PROD_DATABASE_URL is not configured."
            echo "##[error] Add it at: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Environment config verified."
